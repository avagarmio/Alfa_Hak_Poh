# Балансировщик перед инстансами бэкенда (round-robin).
# Состояние общее (Redis), поэтому маска и демаска могут прийти на разные инстансы.
worker_processes auto;
events {
  worker_connections 4096;
}
http {
  access_log off;

  upstream backend {
    server app1:8080;
    server app2:8080;
    server app3:8080;
    keepalive 128;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-System-ID $http_x_system_id;
    }
  }
}
